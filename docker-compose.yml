version: '3.8'
services:

  db:
    image: mysql:8
    container_name: eblogs-mysql
    environment:
      MYSQL_DATABASE: eblogs11
      MYSQL_ROOT_PASSWORD: your_pass
    ports:
      - "3307:3306"

  app:
    build: .
    container_name: eblogs-app
    ports:
      - "8308:8308"
    depends_on:
      - db
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/eblogs11
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: your_pass