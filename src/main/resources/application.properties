server.port=8308
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/eblogs11}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

openai-service.api-key: your_api_key
openai-service.gpt-model: gpt-3.5-turbo

openai-service.urls.base-url: https://api.openai.com/v1
openai-service.urls.chat-url: /chat/completions

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=your_mail
spring.mail.password=your_mail_pass
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

spring.servlet.multipart.max-file-size = 5MB
spring.servlet.multipart.max-request-size = 5MB